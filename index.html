<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pay Now - Savitha K</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(145deg, #f0f4ff 0%, #e6edff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 35px 25px 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(26, 67, 113, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #00baf2, #1a73e8, #0d47a1);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #00baf2, #1a73e8);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(26, 67, 113, 0.3);
        }
        h1 { font-size: 22px; color: #1a2332; margin-bottom: 5px; font-weight: 600; }
        .subtitle { color: #5f6b7a; font-size: 14px; margin-bottom: 20px; }
        .merchant-box {
            background: #f8faff;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #e8edf5;
        }
        .merchant-box .label { font-size: 12px; color: #8a94a6; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .merchant-box .name { font-size: 18px; font-weight: 600; color: #1a2332; margin-top: 3px; }
        .merchant-box .upi-id { font-size: 12px; color: #5f6b7a; background: #eef3fc; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-top: 6px; font-family: monospace; word-break: break-all; }
        .amount-section {
            background: #f0f7ff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px dashed #b3cff5;
        }
        .amount-section .label { font-size: 13px; color: #5f6b7a; font-weight: 500; }
        .amount-section .amount { font-size: 42px; font-weight: 700; color: #0d47a1; margin: 5px 0; }
        .amount-section .amount span { font-size: 24px; font-weight: 500; }
        .order-id { font-size: 12px; color: #8a94a6; margin-top: 3px; }
        .pay-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #00baf2, #1a73e8);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(26, 67, 113, 0.3);
            margin-bottom: 15px;
        }
        .pay-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(26, 67, 113, 0.4); }
        .pay-btn:active { transform: scale(0.97); }
        .divider { display: flex; align-items: center; gap: 15px; margin: 20px 0; color: #b0bcca; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e6ef; }
        .app-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .app-btn {
            padding: 12px 8px;
            border: 2px solid #e8edf5;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            font-weight: 500;
            color: #1a2332;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .app-btn:hover { border-color: #1a73e8; background: #f8faff; transform: scale(1.02); }
        .app-btn:active { transform: scale(0.95); }
        .app-btn .icon { font-size: 24px; }
        .footer { margin-top: 25px; font-size: 12px; color: #b0bcca; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .footer span { display: flex; align-items: center; gap: 5px; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2332;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            z-index: 999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .toast.show { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        .upi-id-text {
            font-family: monospace;
            word-break: break-all;
            background: #f0f4ff;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #1a2332;
            margin: 10px 0;
            border: 1px solid #e0e6ef;
        }
        .copy-btn { background: none; border: none; color: #1a73e8; cursor: pointer; font-size: 13px; font-weight: 500; }
        .copy-btn:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">💳</div>
    <h1>Pay Now</h1>
    <p class="subtitle">Complete your payment securely</p>

    <div class="merchant-box">
        <div class="label">Receiving To</div>
        <div class="name">Savitha K</div>
        <div class="upi-id">paytmqr2810050501011r80bazrbfpc@paytm</div>
        <span class="badge">✅ Merchant Verified</span>
    </div>

    <div class="amount-section">
        <div class="label">Amount</div>
        <div class="amount"><span>₹</span> 1.00</div>
        <div class="order-id">Order #fTrJCT66776959738303</div>
    </div>

    <button class="pay-btn" id="payBtn">🔵 Pay ₹1.00 via UPI</button>

    <div class="divider">Quick Pay</div>

    <div class="app-buttons">
        <button class="app-btn" onclick="payWith('gpay')"><span class="icon">🔵</span>GPay</button>
        <button class="app-btn" onclick="payWith('phonepe')"><span class="icon">💜</span>PhonePe</button>
        <button class="app-btn" onclick="payWith('paytm')"><span class="icon">💙</span>Paytm</button>
        <button class="app-btn" onclick="payWith('whatsapp')"><span class="icon">💚</span>WhatsApp</button>
        <button class="app-btn" onclick="payWith('amazon')"><span class="icon">🟠</span>Amazon</button>
        <button class="app-btn" onclick="copyUPI()"><span class="icon">📋</span>Copy UPI</button>
    </div>

    <div style="margin-top: 20px;">
        <div class="upi-id-text" id="upiDisplay">paytmqr2810050501011r80bazrbfpc@paytm</div>
        <button class="copy-btn" onclick="copyUPI()">📋 Copy UPI ID</button>
    </div>

    <div class="footer">
        <span>🔒 Secure</span>
        <span>⚡ Instant</span>
        <span>🔄 UPI</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const CONFIG = {
        vpa: 'paytmqr2810050501011r80bazrbfpc@paytm',
        name: 'Savitha K',
        amount: '1.00',
        currency: 'INR',
        orderId: 'fTrJCT66776959738303',
        description: 'Payment for Order fTrJCT66776959738303'
    };

    function buildUPIUrl(app) {
        let scheme = 'upi://pay';
        let base = `?pa=${CONFIG.vpa}&pn=${encodeURIComponent(CONFIG.name)}&am=${CONFIG.amount}&cu=${CONFIG.currency}&tr=${CONFIG.orderId}&tn=${encodeURIComponent(CONFIG.description)}`;
        switch(app) {
            case 'gpay': scheme = 'tez://upi/pay'; break;
            case 'phonepe': scheme = 'phonepe://upi/pay'; break;
            case 'paytm': scheme = 'paytmmp://upi/pay'; break;
            case 'whatsapp': scheme = 'whatsapp://upi/pay'; break;
            case 'amazon': scheme = 'amazonpay://upi/pay'; break;
            default: scheme = 'upi://pay';
        }
        return scheme + base;
    }

    function showToast(msg) {
        let toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast show';
        setTimeout(() => { toast.className = 'toast'; }, 3500);
    }

    function copyUPI() {
        let text = CONFIG.vpa;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ UPI ID copied!')).catch(() => fallbackCopy(text));
        } else { fallbackCopy(text); }
    }

    function fallbackCopy(text) {
        let textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); showToast('✅ UPI ID copied!'); } catch(e) { showToast('❌ Copy manually'); }
        document.body.removeChild(textarea);
    }

    function payWith(app) {
        let url = buildUPIUrl(app);
        let appNames = { 'gpay': 'Google Pay', 'phonepe': 'PhonePe', 'paytm': 'Paytm', 'whatsapp': 'WhatsApp', 'amazon': 'Amazon Pay' };
        showToast(`Opening ${appNames[app] || 'UPI'}...`);
        try { window.location.href = url; } catch(e) { showToast('❌ Please install UPI app'); }
        setTimeout(() => showToast(`💡 Pay to: ${CONFIG.vpa}`), 3000);
    }

    document.getElementById('payBtn').addEventListener('click', function() {
        let url = buildUPIUrl('generic');
        showToast('Opening UPI app...');
        try { window.location.href = url; } catch(e) { showToast('❌ Please install a UPI app'); }
        setTimeout(() => showToast(`💡 Pay ₹${CONFIG.amount} to ${CONFIG.vpa}`), 3000);
    });

    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        showToast('📱 iOS: Use GPay/PhonePe buttons');
    }
</script>
</body>
</html>
