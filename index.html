<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech in Market - Direct UPI Gateway Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .payment-card { background: #ffffff; width: 100%; max-width: 400px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h2 { color: #0f172a; font-size: 24px; font-weight: 700; margin-bottom: 20px; }
        
        .input-wrapper { position: relative; margin-bottom: 24px; }
        .input-wrapper span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 600; color: #94a3b8; }
        .input-wrapper input { width: 100%; padding: 14px 16px 14px 38px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 20px; font-weight: 700; color: #1e293b; outline: none; }
        .input-wrapper input:focus { border-color: #4f46e5; }

        .pay-btn { width: 100%; background: #4f46e5; color: #ffffff; padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: block; }
        .pay-btn:hover { background: #4338ca; }
        .pay-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .note { margin-top: 15px; font-size: 12px; color: #94a3b8; line-height: 1.4; }
    </style>
</head>
<body>

<div class="payment-card">
    <h2>Tech in Market</h2>
    
    <div class="input-wrapper">
        <span>₹</span>
        <input type="number" id="amountInput" placeholder="Enter Amount" min="10" value="10">
    </div>

    <button class="pay-btn" id="payButton" onclick="payDirectViaUpiGateway()">Proceed to Pay</button>
    <p class="note" id="statusMessage">Enter an amount (minimum ₹10) and click proceed to test your phone's native UPI app picker.</p>
</div>

<script>
    // ⬇️ PLUG IN YOUR EXACT LIVE INSTAMOJO CREDENTIALS HERE ⬇️
    const CLIENT_ID = "vCC5TaM9Pze1s0UQUcqeJozFxsuhqwSmpDJno9Rk";
    const CLIENT_SECRET = "GNuQCY0n9Twyfg4zklLCLp0ejDucRYdOo2N4LngE56dUMUTr1OeFfRwwMkudPsi5CkQGmUAzEmC0qkvjYFAqb8ZNUcWQ1th3KibOw2Fix2omhehlKsnkmcDFOUdK07bz";
    const API_KEY = "93c5befca61a5d9628a163ae0e0cd8a6";
    const AUTH_TOKEN = "1586c873e445e67b0d86213901c2815";

    async function payDirectViaUpiGateway() {
        const amount = document.getElementById('amountInput').value;
        const btn = document.getElementById('payButton');
        const statusText = document.getElementById('statusMessage');

        if (!amount || parseFloat(amount) < 10) {
            alert("Minimum amount for Instamojo gateway processing is ₹10.");
            return;
        }

        // Lock UI during API call execution
        btn.disabled = true;
        statusText.innerText = "Authenticating secure merchant session...";

        try {
            // Step 1: Generate access token using OAuth2
            const tokenParams = new URLSearchParams({
                grant_type: 'client_credentials',
                client_id: CLIENT_ID,
                client_secret: CLIENT_SECRET
            });

            const tokenResponse = await fetch('https://api.instamojo.com/oauth2/token/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: tokenParams
            });
            
            const tokenData = await tokenResponse.json();
            const accessToken = tokenData.access_token;

            if (!accessToken) {
                throw new Error("Could not fetch Access Token. Check Client ID/Secret strings.");
            }

            statusText.innerText = "Generating custom UPI payment link...";

            // Step 2: Request the live link payload
            const orderPayload = new URLSearchParams({
                amount: parseFloat(amount).toFixed(2),
                purpose: "Tech In Market Test Payment",
                buyer_name: "Test Customer",
                send_sms: "False",
                send_email: "False",
                redirect_url: window.location.href // Returns user back here when done
            });

            const orderResponse = await fetch('https://api.instamojo.com/v2/payment_requests/', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Api-Key': API_KEY,
                    'X-Auth-Token': AUTH_TOKEN
                },
                body: orderPayload
            });

            const orderData = await orderResponse.json();
            const regularUrl = orderData.longurl;

            if (!regularUrl) {
                throw new Error("Failed to capture transaction mapping URL.");
            }

            statusText.innerText = "Launching phone UPI apps drawer...";

            /* Step 3: The Magic Intent Transformation!
               Replacing 'www.instamojo.com/' with 'www.instamojo.com/intent/' 
               bypasses the gateway webpage entirely and directly prompts 
               the smartphone to open Google Pay, PhonePe, or Paytm instantly.
            */
            const mobileIntentUrl = regularUrl.replace('www.instamojo.com/', 'www.instamojo.com/intent/');
            
            // Fire the application change sequence
            window.location.href = mobileIntentUrl;

        } catch (error) {
            console.error(error);
            alert("Transaction Setup Fault: " + error.message);
            btn.disabled = false;
            statusText.innerText = "Error encountered. Try again.";
        }
    }
</script>

</body>
</html>
